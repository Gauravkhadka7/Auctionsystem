{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Change Password — LotHouse{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 480px;">
  <div class="card-panel p-4">
    <h2 class="mb-4">Change Password</h2>
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button class="btn btn-brass w-100 mt-2" type="submit">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
