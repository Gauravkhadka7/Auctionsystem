{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Reset Password — LotHouse{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 440px;">
  <div class="card-panel p-4">
    <h2 class="mb-1">Reset your password</h2>
    <p class="text-cream-dim mb-4">Enter your email and we'll send you a reset link.</p>
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button class="btn btn-brass w-100 mt-2" type="submit">Send Reset Link</button>
    </form>
  </div>
</div>
{% endblock %}
