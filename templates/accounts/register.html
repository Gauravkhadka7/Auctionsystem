{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Register — LotHouse{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 640px;">
  <div class="card-panel p-4">
    <h2 class="mb-1">Create your account</h2>
    <p class="text-cream-dim mb-4">Register as a bidder to start bidding, or a seller to list items.</p>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form|crispy }}
      <button class="btn btn-brass w-100 mt-2" type="submit">Create Account</button>
    </form>
    <p class="small mt-3 mb-0">Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
  </div>
</div>
{% endblock %}
