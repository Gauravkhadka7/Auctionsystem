{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Set New Password — LotHouse{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 440px;">
  <div class="card-panel p-4">
    <h2 class="mb-4">Set a new password</h2>
    {% if validlink %}
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn btn-brass w-100 mt-2" type="submit">Change Password</button>
      </form>
    {% else %}
      <p class="text-cream-dim">This reset link is invalid or has expired.</p>
    {% endif %}
  </div>
</div>
{% endblock %}
