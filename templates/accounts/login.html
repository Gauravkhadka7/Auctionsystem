{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Login — LotHouse{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 440px;">
  <div class="card-panel p-4">
    <h2 class="mb-1">Welcome back</h2>
    <p class="text-cream-dim mb-4">Log in to bid, sell, or manage your account.</p>
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button class="btn btn-brass w-100 mt-2" type="submit">Login</button>
    </form>
    <div class="d-flex justify-content-between mt-3 small">
      <a href="{% url 'accounts:password_reset' %}">Forgot password?</a>
      <a href="{% url 'accounts:register' %}">Create an account</a>
    </div>
  </div>
</div>
{% endblock %}
