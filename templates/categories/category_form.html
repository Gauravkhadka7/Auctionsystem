{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{% if is_edit %}Edit{% else %}Add{% endif %} Category — LotHouse{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 560px;">
  <div class="card-panel p-4">
    <h2 class="mb-4">{% if is_edit %}Edit{% else %}Add{% endif %} Category</h2>
    <form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form|crispy }}<button class="btn btn-brass mt-2" type="submit">Save</button></form>
  </div>
</div>
{% endblock %}
